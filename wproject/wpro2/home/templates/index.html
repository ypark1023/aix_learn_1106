<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생선 무게 예측</title>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
        let myChart = null; // 차트 객체 전역 변수

        function sendBtn(){
            // input 데이터 가져오기
            const send_data = $('#data').val();
            console.log("데이터 : "+send_data);
            
            // views.py로 데이터 전달
            $.ajax({
                url:'/ajax_data/',
                type:'post',
                headers:{'X-CSRFToken':'{{csrf_token}}'},
                data:{'data':send_data},
                dataType:'json',
                success:function(response){
                    alert('예측 성공');
                    console.log(response);
                    
                    // 1. 딕셔너리 데이터로 HTML 업데이트
                    $('#result').text("입력데이터 : " + response.result);
                    $('#result2').text("예측 생선 : " + response.result2);
                    $('#result3').text("예측 확률 : " + (response.result3 * 100).toFixed(1) + "%");

                    // 2. 확률 막대그래프 그리기
                    drawProbabilityChart(response.species_list, response.probs, response.result2);
                },
                error:function(xhr, status, error){
                    alert('예측 오류');
                    console.log(error);
                }
            });
        }

        function drawProbabilityChart(labels, data, predictedSpecies) {
            const ctx = document.getElementById('probabilityChart').getContext('2d');
            
            // 이미 그려진 차트가 있다면 파괴하고 새로 생성 (중복 렌더링 방지)
            if (myChart) {
                myChart.destroy();
            }

            // 예측된 생선만 파란색, 나머지는 회색으로 색상 설정
            const backgroundColors = labels.map(species => 
                species === predictedSpecies ? 'rgba(50, 129, 255, 0.8)' : 'rgba(201, 203, 207, 0.5)'
            );

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '예측 확률',
                        data: data,
                        backgroundColor: backgroundColors,
                        borderColor: backgroundColors.map(color => color.replace('0.8', '1').replace('0.5', '1')),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 1.0 // 확률은 0 ~ 1 사이
                        }
                    }
                }
            });
        }
    </script>
</head>

<body>
    <h1>메인페이지</h1>
    <div>
        <label> 생선 무게, 길이, 대각선, 높이, 두께를 입력하세요
            <p>(예: 242.0,25.4,30.0,11.52,4.0200)</p>
        </label><br/>
        <input type='text' name='data' id='data'>
        <button type='button' onclick='sendBtn()'>예측</button>
        <br>
        <br>
        <div id='result'>입력데이터 :  {{result}}</div>
        <div id='result2'>예측 생선 :  {{result2}}</div>
        <div id='result3'>예측 확률 : {{result3}}</div>
    </div>


    <!-- 그래프 그리기 -->
    <br>
    <!-- 차트가 그려질 캔버스 영역 -->
    <div style="width: 600px; height: 300px;">
            <canvas id="probabilityChart"></canvas>
        </div>
    </div>

</body>
</html>
