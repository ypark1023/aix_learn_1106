    <title>생선 무게 예측</title>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        function sendBtn(){
            // input에 있는 데이터 가져오기
            const send_data = $('#data').val();
            console.log("데이터 : "+send_data);
            // views.py로 데이터 전달
            $.ajax({
                url:'/ajax_data/',
                type:'post',
                headers:{'X-CSRFToken':'{{csrf_token}}'},
                data:{'data':send_data},
                dataType:'json',
                success:function(data){
                    alert('예측 성공');
                    console.log(data)
                    
                    /*const chart_data = Number(data.result_data);
                    $('#result').text(send_data);
                    $('#result2').text(data.result_data);*/
                },
                fail:function(){
                    alert('예측 오류')
                }
            });
        }
    </script>
</head>

<body>
    <h1>메인페이지</h1>
    <div>
        <label> Weight, Length, Diagonal, Height, Width를 입력하세요</label><br/>
        <input type='text' name='data' id='data'>
        <button type='button' onclick='sendBtn()'>예측</button>
        <br>
        <br>
        <div id='result'>입력데이터 :  {{result}}</div>
        <div id='result2'>예측생선 : {{result2}}</div>
    </div>
